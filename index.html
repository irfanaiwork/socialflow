<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialFlow Automation CRM</title>
    <meta name="description" content="Centralized social media content automation CRM for Pinterest and Facebook Pages with AI media analysis, smart scheduling, per-page posting gaps, and queue management." />
    <meta property="og:title" content="SocialFlow Automation CRM" />
    <meta property="og:description" content="Centralized social media content automation CRM for Pinterest and Facebook Pages with AI media analysis, smart scheduling, per-page posting gaps, and queue management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        // Intercept Object.defineProperty calls on window/Window.prototype for 'fetch' to ensure a setter exists
        try {
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || (typeof Window !== 'undefined' && obj === Window.prototype)) && prop === 'fetch' && descriptor) {
              if (descriptor.get && !descriptor.set) {
                let currentVal;
                const origGet = descriptor.get;
                descriptor.set = function(val) {
                  currentVal = val;
                };
                descriptor.get = function() {
                  return currentVal !== undefined ? currentVal : origGet.call(this);
                };
                descriptor.configurable = true;
              }
            }
            return origDefineProperty.call(this, obj, prop, descriptor);
          };
        } catch (_) {}

        // Repair existing getter-only fetch property if already present
        try {
          let currentFetch = window.fetch;
          let canAssign = true;
          try {
            window.fetch = currentFetch;
          } catch (_) {
            canAssign = false;
          }

          if (!canAssign) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(newFetch) {
                currentFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}

        // Global error suppression for harmless window.fetch getter assignment errors from preview wrappers
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('Cannot set property fetch')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
